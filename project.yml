# project.yml — fonte de verdade do projeto Xcode (gerado via `xcodegen generate`).
# O .xcodeproj é derivado deste arquivo e fica no .gitignore (decisão XcodeGen,
# mesmo padrão do Leitor.md / Hora do Remédio — spec seção 4/18).
#
# App: "O que eu ando lendo" (nome de exibição confirmado, spec seção 16/24).
# Codinome técnico do target/pasta/bundle: "Estante" (spec seção 24).
name: Estante

options:
  bundleIdPrefix: com.dablab              # mesmo prefixo do Leitor.md/Hora do Remédio (spec 4/25)
  deploymentTarget:
    iOS: "17.0"                           # exigência do SwiftData (spec 4/24)
  developmentLanguage: pt-BR              # idioma único do MVP (spec 17/24)
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: XGZW6Y6K25          # team de assinatura reaproveitado (spec 4/25)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    # #Predicate do SwiftData gera warnings de concorrência (código da Apple);
    # mantém em minimal, mesmo racional do Leitor.md.
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # ---------------------------------------------------------------------------
  # App principal (SwiftUI + SwiftData). Local-first, sem CloudKit no MVP (spec 4).
  # ---------------------------------------------------------------------------
  Estante:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
      - path: Resources
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dablab.estante
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"      # iPhone + iPad (roda no iPad sem layout dedicado, spec 3/17)
        SUPPORTS_MACCATALYST: NO           # iOS-only (spec 3)

  # ---------------------------------------------------------------------------
  # Testes unitários — lógica pura de cálculo/regra (spec 22).
  # ---------------------------------------------------------------------------
  EstanteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EstanteTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dablab.estante.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Estante

schemes:
  Estante:
    build:
      targets:
        Estante: all
        EstanteTests: [test]
    run:
      config: Debug
      # StoreKit config local para testar o Paywall/compra em sandbox (spec 8.10/27).
      storeKitConfiguration: Estante.storekit
    test:
      config: Debug
      targets:
        - EstanteTests
